AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless Document Processing Pipeline Infrastructure

Resources:
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  DocumentProcessingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-dlq
      MessageRetentionPeriod: 1209600

  DocumentProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-queue
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DocumentProcessingDeadLetterQueue.Arn
        maxReceiveCount: 3

  DocumentProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DocumentProcessingQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3BucketToSendMessages
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DocumentProcessingQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:s3:::${AWS::StackName}-documents-${AWS::AccountId}

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DependsOn: DocumentProcessingQueuePolicy
    Properties:
      BucketName: !Sub ${AWS::StackName}-documents-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt DocumentProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTlsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub ${DocumentsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 14

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${ApiFunctionLogGroup.Arn}:*
        - PolicyName: DynamoDbAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt DocumentsTable.Arn
        - PolicyName: S3UploadAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${DocumentsBucket.Arn}/uploads/*

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiFunctionLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Runtime: nodejs20.x
      Handler: api.handler
      Code: ../dist
      Role: !GetAtt ApiFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref DocumentsTable
          BUCKET_NAME: !Ref DocumentsBucket

  WorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: 14

  WorkerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-worker-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${WorkerFunctionLogGroup.Arn}:*
        - PolicyName: DynamoDbAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt DocumentsTable.Arn
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${DocumentsBucket.Arn}/uploads/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${DocumentsBucket.Arn}/processed/*
        - PolicyName: SqsExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt DocumentProcessingQueue.Arn

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerFunctionLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-worker
      Runtime: nodejs20.x
      Handler: worker.handler
      Code: ../dist
      Role: !GetAtt WorkerFunctionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref DocumentsTable
          BUCKET_NAME: !Ref DocumentsBucket

  WorkerFunctionEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt DocumentProcessingQueue.Arn
      FunctionName: !GetAtt WorkerFunction.Arn
      BatchSize: 1
      Enabled: true

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-http-api
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  PostDocumentsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /documents'
      Target: !Sub integrations/${HttpApiIntegration}

  GetDocumentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /documents/{id}'
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

Outputs:
  DocumentsTableName:
    Description: DynamoDB Documents Table Name
    Value: !Ref DocumentsTable
    Export:
      Name: !Sub ${AWS::StackName}-DocumentsTableName

  DocumentsBucketName:
    Description: S3 Documents Bucket Name
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub ${AWS::StackName}-DocumentsBucketName

  DocumentsBucketArn:
    Description: S3 Documents Bucket ARN
    Value: !GetAtt DocumentsBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DocumentsBucketArn

  HttpApiUrl:
    Description: API Gateway HTTP API Endpoint URL
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-HttpApiUrl

  HttpApiId:
    Description: API Gateway HTTP API ID
    Value: !Ref HttpApi
    Export:
      Name: !Sub ${AWS::StackName}-HttpApiId

  DocumentProcessingQueueUrl:
    Description: SQS Document Processing Queue URL
    Value: !Ref DocumentProcessingQueue
    Export:
      Name: !Sub ${AWS::StackName}-DocumentProcessingQueueUrl

  DocumentProcessingQueueArn:
    Description: SQS Document Processing Queue ARN
    Value: !GetAtt DocumentProcessingQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DocumentProcessingQueueArn

  DocumentProcessingDeadLetterQueueUrl:
    Description: SQS Document Processing Dead Letter Queue URL
    Value: !Ref DocumentProcessingDeadLetterQueue
    Export:
      Name: !Sub ${AWS::StackName}-DocumentProcessingDeadLetterQueueUrl

  DocumentProcessingDeadLetterQueueArn:
    Description: SQS Document Processing Dead Letter Queue ARN
    Value: !GetAtt DocumentProcessingDeadLetterQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DocumentProcessingDeadLetterQueueArn

  WorkerFunctionArn:
    Description: Worker Lambda Function ARN
    Value: !GetAtt WorkerFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WorkerFunctionArn
