AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless Document Processing Pipeline Infrastructure

Resources:
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-documents-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  DocumentsTableName:
    Description: DynamoDB Documents Table Name
    Value: !Ref DocumentsTable
    Export:
      Name: !Sub ${AWS::StackName}-DocumentsTableName

  DocumentsBucketName:
    Description: S3 Documents Bucket Name
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub ${AWS::StackName}-DocumentsBucketName

  DocumentsBucketArn:
    Description: S3 Documents Bucket ARN
    Value: !GetAtt DocumentsBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DocumentsBucketArn
