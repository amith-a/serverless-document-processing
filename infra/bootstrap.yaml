AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap Infrastructure - Deployment Artifacts Bucket

Resources:
  DeploymentArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 14
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  DeploymentArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTlsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DeploymentArtifactsBucket.Arn
              - !Sub ${DeploymentArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  DeploymentBucketName:
    Description: S3 Bucket for CloudFormation Lambda Deployment Artifacts
    Value: !Ref DeploymentArtifactsBucket
    Export:
      Name: !Sub ${AWS::StackName}-DeploymentBucketName
